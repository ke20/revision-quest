# Développement local de Révision Quest : un seul projet Compose, un seul réseau.
#   mise run up        (docker compose up -d --build)  puis  https://revision-quest.local
#   mise run down      arrête tout ;  mise run logs  suit les journaux
# Une fois : mise run dev:hosts (domaines locaux) et mise run dev:trust (autorité HTTPS de Caddy). Voir api/README.md.
name: revision-quest

services:
  php:
    build:
      context: ./api
      target: dev
    environment:
      SERVER_NAME: revision-quest.local
      APP_SECRET: ${APP_SECRET:-dev-only-not-a-secret}   # développement seulement ; la production a son propre secret
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app-dev-only}@database:5432/app?serverVersion=18&charset=utf8
      MAILER_DSN: smtp://mailer:1025
      FRANKENPHP_CONFIG: ""
    volumes:
      - ./api:/app
      # le jeu, exactement les fichiers publiés sur GitHub Pages (jamais specs/, resources/, api/ ni .env)
      - ./index.html:/srv/game/index.html:ro
      - ./editeur.html:/srv/game/editeur.html:ro
      - ./voix.html:/srv/game/voix.html:ro
      - ./js:/srv/game/js:ro
      - ./css:/srv/game/css:ro
      - ./fonts:/srv/game/fonts:ro
      - ./packs:/srv/game/packs:ro
      - ./docker/caddy:/etc/caddy/dev:ro   # sites de développement (Mailpit)
      - caddy_data:/data
      - caddy_config:/config
    ports:                                 # seulement sur cette machine (pas sur le réseau local)
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"
    depends_on:
      database:
        condition: service_healthy
    networks: [revision-quest]

  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-dev-only}
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [revision-quest]

  mailer:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks: [revision-quest]

networks:
  revision-quest:
    name: revision-quest

volumes:
  caddy_data:
  caddy_config:
  database_data:
