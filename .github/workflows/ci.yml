name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly run, even without commits: catches newly published vulnerabilities (npm audit)
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, validate packs, unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base commit of a pull request, to list the pack files it adds or changes
          persist-credentials: false

      # Installs the tools pinned in mise.toml (Node.js), with cache
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          cache: true

      # Course proposed from a fork: each pack file added or changed is checked (strict format, never executed)
      # and gets its catalogue entry in this run only, as the maintainer will do with `mise run pack:add` before
      # merging. Report in the pull request summary. Pull requests from this repository stay strict: no help here.
      - name: Proposed courses (pull request from a fork)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-proposed-packs.sh "$BASE_SHA"

      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # npm ci + Playwright Chromium (--with-deps on CI), npm audit, then qa: lint, validate, unit, e2e (stops at the first failure)
      - name: Install and test (mise run ci)
        run: mise run ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # GitHub Pages: only from main, only once every test passed, only the game files.
  # One-time setup: Settings → Pages → Source: « GitHub Actions ».
  pages-build:
    name: Build the Pages site (game files only)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # what the game needs, nothing else: no tests, tools, notes, README or package files.
      # packs/catalog.js is not in git: built here from the pack files (tools/catalog.js, no dependency).
      - name: Copy the game files
        run: |
          node tools/catalog.js
          mkdir -p _site
          cp -R index.html voix.html js css fonts packs _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the only job allowed to publish: the rest of the workflow keeps read-only rights
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
