<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Security: only scripts from this site run (no inline or injected scripts), no network calls,
       no plugins, no forms, styles and fonts only from this site (Fredoka is self-hosted in fonts/). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#7C3AED">
  <title>Révision Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <noscript><p style="padding:24px;color:#fff">Active JavaScript pour jouer.</p></noscript>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- App name + UI texts, catalogue of packs, pack loader, pack rules + « Mes cours ». Content packs (packs/*.js) are loaded
       on demand by js/core/packs.js with <script src> (allowed by script-src 'self'). -->
  <script src="js/core/i18n.js"></script>
  <script src="packs/catalog.js"></script>
  <script src="js/core/packs.js"></script>
  <script src="js/core/pack-rules.js"></script>
  <script src="js/core/courses.js"></script>
  <script src="js/core/engine/constants.js"></script>
  <script src="js/core/engine/encoding.js"></script>
  <script src="js/core/engine/normalize.js"></script>
  <script src="js/core/engine/cookie.js"></script>
  <script src="js/core/engine/merge.js"></script>
  <script src="js/core/engine/storage.js"></script>
  <script src="js/core/engine/progress.js"></script>
  <script src="js/core/engine/api/play.js"></script>
  <script src="js/core/engine/api/profiles.js"></script>
  <script src="js/core/engine/api/share.js"></script>
  <script src="js/core/engine/engine.js"></script>
  <script src="js/exercises/figures.js"></script>
  <script src="js/exercises/common/text.js"></script>
  <script src="js/exercises/common/checks.js"></script>
  <script src="js/exercises/common/dom.js"></script>
  <script src="js/exercises/common/bubbles.js"></script>
  <script src="js/exercises/common/speech.js"></script>
  <script src="js/exercises/common/documents.js"></script>
  <script src="js/exercises/types/mcq.js"></script>
  <script src="js/exercises/types/sort.js"></script>
  <script src="js/exercises/types/match.js"></script>
  <script src="js/exercises/types/order.js"></script>
  <script src="js/exercises/types/fill.js"></script>
  <script src="js/exercises/types/spot.js"></script>
  <script src="js/exercises/types/write.js"></script>
  <script src="js/exercises/exercises.js"></script>
  <script src="js/vendor/qrcodegen.js"></script>
  <!-- screens: ES modules (js/app/*.js, entry main.js); a browser too old for modules shows a message instead -->
  <script type="module" src="js/app/main.js"></script>
  <script nomodule src="js/nomodule.js"></script>
</body>
</html>
