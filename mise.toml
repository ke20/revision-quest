# Révision Quest — tools and tasks (https://mise.jdx.dev).
#   mise install        installs the pinned Node.js
#   mise tasks          lists the tasks below
#   mise run dev        serves the game on http://127.0.0.1:4173/
#   mise run qa         lint + contrat API (oas) + type check + validate + unit tests + end-to-end tests
# npm scripts (package.json) stay usable without mise.

[tools]
node = "26.13.0"

[env]
PORT = "4173"

[tasks.install]
description = "Install the test tooling (npm ci + Playwright Chromium; system deps too on CI)"
run = [
  "npm ci",
  "if [ -n \"$CI\" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi",
]

[tasks.start]
description = "Serve the game (static server, no build) and print its URL"
run = "npm start"

[tasks.dev]
description = "Alias of start: serve the game locally"
depends = ["start"]

[tasks.lint]
description = "Lint the JavaScript (ESLint, eslint.config.js)"
run = "npm run lint"

[tasks."lint:fix"]
description = "Lint and fix what ESLint can fix automatically"
run = "npm run lint:fix"

[tasks.typecheck]
description = "Type-check the game's JavaScript with TypeScript (JSDoc types, nothing emitted: tsconfig.json, then tsconfig.tools.json for the Node tools)"
run = "npm run typecheck"

[tasks.validate]
description = "Check every content pack and the catalogue built from them (tools/validate-pack.js --all)"
run = "npm run validate"

[tasks."pack:add"]
description = "Check a chapter file and put it in packs/: mise run pack:add <fichier.js>"
run = "node tools/pack-add.js"

[tasks."pack:ids"]
description = "Give an id (UUID v4) to every exercise without one, reusing the ids of the git version: mise run pack:ids [fichier.js…]"
run = "node tools/pack-ids.js"

[tasks.catalog]
description = "Write packs/catalog.js (not in git) for a server other than mise run dev, which builds it on each request"
run = "node tools/catalog.js"

[tasks."test:unit"]
description = "Unit tests (node:test): engine, exercises, catalogue, pack validator, docs"
run = "npm run test:unit"

[tasks."test:e2e"]
description = "End-to-end tests (Playwright, Chromium desktop + 390 px)"
run = "npm run test:e2e"

[tasks.test]
description = "validate + unit tests + end-to-end tests"
run = [
  { task = "validate" },
  { task = "test:unit" },
  { task = "test:e2e" },
]

[tasks."oas:lint"]
description = "Lint the API contract oas/ (OpenAPI 3.1, Redocly CLI pinned, downloaded by npx)"
run = "npm run oas:lint"

[tasks.qa]
description = "Everything, fail fast: lint, API contract lint, type check, then validate + unit tests + end-to-end tests"
run = [
  { task = "lint" },
  { task = "oas:lint" },
  { task = "typecheck" },
  { task = "test" },
]

[tasks.report]
description = "Open the last Playwright HTML report"
run = "npx playwright show-report"

[tasks.audit]
description = "Known vulnerabilities in npm dependencies (needs internet; fails from moderate severity)"
run = "npm run audit"

[tasks.ci]
description = "Exactly what GitHub Actions runs: install, audit, then qa"
run = [
  { task = "install" },
  { task = "audit" },
  { task = "qa" },
]

# ---------- serveur local (Docker : FrankenPHP + PostgreSQL + Mailpit, voir api/README.md) ----------
[tasks.up]
description = "Start the local server in Docker (game + API on https://revision-quest.local, Mailpit on https://mail.revision-quest.local)"
run = ["node tools/catalog.js", "docker compose up -d --build"]

[tasks.down]
description = "Stop the local Docker containers (the database volume is kept)"
run = "docker compose down"

[tasks.logs]
description = "Follow the logs of the local containers"
run = "docker compose logs -f"

[tasks."dev:hosts"]
description = "Once: add revision-quest.local and mail.revision-quest.local to /etc/hosts (asks for your password)"
run = "grep -q 'revision-quest.local' /etc/hosts && echo 'Déjà dans /etc/hosts' || echo '127.0.0.1 revision-quest.local mail.revision-quest.local' | sudo tee -a /etc/hosts"

[tasks."dev:trust"]
description = "Once (macOS): trust the local HTTPS authority of Caddy, so the browser accepts https://revision-quest.local (asks for your password)"
run = [
  "docker compose cp php:/data/caddy/pki/authorities/local/root.crt ./var-caddy-root.crt",
  "sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain ./var-caddy-root.crt",
  "rm ./var-caddy-root.crt",
]

[tasks."api:qa"]
description = "API quality: style, Rector, PHPStan, deptrac, PHPUnit (in the php container)"
run = "docker compose exec php composer qa"

[tasks."api:console"]
description = "Symfony console in the php container: mise run api:console -- debug:router"
run = "docker compose exec php bin/console"

[tasks."api:composer"]
description = "Composer in the php container: mise run api:composer -- require some/package"
run = "docker compose exec php composer"
