# Adultes seulement (parent, enseignant), sans mot de passe : connexion par un lien e-mail à usage unique (login_link),
# puis session dans le cookie rq_session. L'enfant n'a pas de compte : ses appareils seront reliés à l'étape 4.
security:
    providers:
        adults:
            id: App\Infrastructure\Security\AdultUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: adults
            # pas de session : 401 en Problem Details (jamais de redirection vers une page de connexion)
            entry_point: App\Infrastructure\Security\ProblemEntryPoint
            login_link:
                check_route: auth_check
                lifetime: 600
                # usage unique : le lien est signé avec le nombre de connexions (une connexion invalide tous les liens
                # envoyés avant) et, une fois utilisé, gardé en cache jusqu'à son expiration (même si le compte est
                # supprimé puis recréé entre-temps)
                signature_properties: [loginStamp]
                max_uses: 1
                used_link_cache: login_link.used_cache
                default_target_path: /suivi
                always_use_default_target_path: true
                failure_handler: App\Infrastructure\Security\LoginLinkFailureHandler
            logout:
                path: auth_logout
                delete_cookies:
                    rq_session: { path: /, secure: true, samesite: lax }

    # les droits sont posés sur chaque Action (#[IsGranted]) ; rien ici
    access_control: []
